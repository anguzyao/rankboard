<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <link
  rel="apple-touch-icon"
  sizes="180x180"
  href="/corner-x-scoreboard-icon-180.png"
>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Corner X 計分排行榜</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <main class="app">

    <!-- =========================
         Header
         ========================= -->

    <header class="header">

      <div>

       <img
  class="site-logo"
  src="/logo.png"
  alt="CORNER X"
>

        <h1 id="siteTitle">
          比賽排名
        </h1>

      </div>

      <button
        id="adminButton"
        class="icon-button"
        aria-label="管理員登入"
      >
        🔒
      </button>

    </header>


    <!-- =========================
         競賽切換
         ========================= -->

    <section
      id="competitionTabs"
      class="competition-tabs"
    >
    </section>


    <!-- =========================
         排名狀態
         ========================= -->

    <section class="status-card">

      <div>

        <span class="status-label">
          目前排名
        </span>

        <strong id="updatedAt">
          尚未更新
        </strong>

      </div>

    </section>


    <!-- =========================
         公開排名
         ========================= -->

    <section
      id="rankingList"
      class="ranking-list"
    >

      <div class="empty-state">

        <p>
          目前尚無參賽者
        </p>

      </div>

    </section>

  </main>


  <script src="/app.js"></script>
  
<!-- ============================================================
     Corner X 賽程安排器入口
============================================================ -->

<a
  href="/tournament.html"
  style="
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 9999;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 18px;
    border: 1px solid #8cff00;
    border-radius: 10px;
    background: #111;
    color: #8cff00;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 0 12px rgba(140, 255, 0, 0.15);
  "
>
  🏆 賽程安排器
</a>
  
</body>

</html>
