<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Corner X 賽程安排器</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #eee;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    .container {
      width: min(100% - 32px, 900px);
      margin: 0 auto;
      padding: 32px 0 60px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: 800;
    }

    .subtitle {
      color: #999;
      margin-bottom: 28px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #bbb;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #444;
      background: #0f0f0f;
      color: #fff;
      border-radius: 9px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #8cff00;
    }

    textarea {
      min-height: 260px;
      resize: vertical;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #8cff00;
      color: #111;
    }

    .secondary {
      background: #333;
      color: #fff;
    }

    .danger {
      background: #d93636;
      color: #fff;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #111;
      border: 1px solid #333;
      white-space: pre-wrap;
    }

    .success {
      border-color: #8cff00;
      color: #bfff66;
    }

    .error {
      border-color: #d93636;
      color: #ff7777;
    }

    .tournament-item {
      border: 1px solid #333;
      background: #111;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .tournament-item strong {
      display: block;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .muted {
      color: #888;
      font-size: 13px;
    }

    pre {
      background: #0b0b0b;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 16px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.5;
      color: #ddd;
    }

    /* ==========================================================
       賽程流程圖
       ========================================================== */

    .bracket-wrapper {
      margin-top: 18px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #0b0b0b;
      padding: 18px;
      overflow-x: auto;
    }

    .bracket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .bracket-title {
      font-size: 18px;
      font-weight: 800;
    }

    .bracket-meta {
      color: #888;
      font-size: 13px;
      white-space: nowrap;
    }

    .bracket-board {
      display: flex;
      align-items: flex-start;
      gap: 22px;
      min-width: max-content;
      padding: 8px 4px 18px;
    }

    .bracket-column {
      width: 190px;
      flex: 0 0 190px;
    }

    .bracket-column-title {
      text-align: center;
      color: #bfff66;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 14px;
      padding: 8px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #151515;
    }

    .bracket-matches {
      display: flex;
      flex-direction: column;
    }

    .match-card {
      position: relative;
      border: 1px solid #444;
      border-radius: 9px;
      overflow: visible;
      background: #151515;
      min-height: 82px;
    }

    .match-card::after {
      content: "";
      position: absolute;
      right: -23px;
      top: 50%;
      width: 22px;
      height: 1px;
      background: #555;
    }

    .bracket-column:last-child .match-card::after {
      display: none;
    }

    .match-card.bye {
      border-color: #53613d;
      background: #12170e;
    }

    .match-card.ready {
      border-color: #8cff00;
      box-shadow: 0 0 0 1px rgba(140, 255, 0, 0.08);
    }

    .match-card.completed {
      border-color: #555;
    }

    .match-label {
      padding: 5px 9px;
      font-size: 11px;
      color: #777;
      border-bottom: 1px solid #2d2d2d;
    }

    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      min-height: 28px;
      font-size: 13px;
    }

    .player-row + .player-row {
      border-top: 1px solid #292929;
    }

    .player-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-name.winner {
      color: #bfff66;
      font-weight: 800;
    }

    .player-name.empty {
      color: #555;
      font-style: italic;
    }

    .player-score {
      min-width: 20px;
      text-align: right;
      color: #aaa;
      font-variant-numeric: tabular-nums;
    }

    .match-status {
      padding: 5px 9px 7px;
      color: #777;
      font-size: 11px;
    }

    .match-status.ready-text {
      color: #bfff66;
    }

    .match-status.bye-text {
      color: #9aaa7b;
    }

    .bracket-empty {
      padding: 24px;
      text-align: center;
      color: #777;
      border: 1px dashed #444;
      border-radius: 10px;
    }

    .raw-detail {
      margin-top: 18px;
    }

    @media (max-width: 600px) {
      .bracket-wrapper {
        padding: 12px;
      }

      .bracket-column {
        width: 175px;
        flex-basis: 175px;
      }

      .bracket-board {
        gap: 18px;
      }

      .bracket-meta {
        white-space: normal;
        text-align: right;
      }
    }


    .login-box {
      max-width: 420px;
      margin: 80px auto;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 20px, 900px);
        padding-top: 20px;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 16px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <!-- ======================================================
       登入
  ======================================================= -->

  <div
    id="loginScreen"
    class="login-box"
  >
    <div class="card">

      <h1>Corner X</h1>

      <div class="subtitle">
        賽程安排器
      </div>

      <div class="field">

        <label>
          管理員密碼
        </label>

        <input
          id="password"
          type="password"
          placeholder="輸入管理員密碼"
        />

      </div>

      <button
        id="loginButton"
        class="primary"
      >
        登入
      </button>

      <div
        id="loginStatus"
        class="status hidden"
      ></div>

    </div>
  </div>


  <!-- ======================================================
       管理介面
  ======================================================= -->

  <main
    id="app"
    class="container hidden"
  >

    <h1>
      Corner X 賽程安排器
    </h1>

    <div class="subtitle">
      目前為功能測試版
    </div>


    <!-- ====================================================
         建立賽事
    ===================================================== -->

    <section class="card">

      <h2>
        建立新賽事
      </h2>

      <div class="field">

        <label>
          賽事名稱
        </label>

        <input
          id="tournamentName"
          type="text"
          placeholder="例如：第二屆渣男陀螺盃"
        />

      </div>


      <div class="row">

        <div class="field">

          <label>
            賽制
          </label>

          <select id="format">

            <option value="single_elimination">
              單淘汰
            </option>

            <option value="double_elimination">
              雙敗
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            排序
          </label>

          <select id="randomize">

            <option value="false">
              保持輸入順序
            </option>

            <option value="true">
              隨機洗牌
            </option>

          </select>

        </div>

      </div>


      <div class="field">

        <label>
          參賽者
          <span class="muted">
            一行一位，2～48 人
          </span>
        </label>

        <textarea
          id="participants"
          placeholder="Angus
小明
小華
阿杰
阿倫
阿凱
阿翔
阿偉"
        ></textarea>

      </div>


      <div class="button-row">

        <button
          id="createButton"
          class="primary"
        >
          建立賽事
        </button>

        <button
          id="logoutButton"
          class="secondary"
        >
          登出
        </button>

      </div>


      <div
        id="createStatus"
        class="status hidden"
      ></div>

    </section>


    <!-- ====================================================
         現有賽事
    ===================================================== -->

    <section class="card">

      <h2>
        現有賽事
      </h2>

      <div id="tournamentList">
        載入中...
      </div>

    </section>


    <!-- ====================================================
         賽事資料
    ===================================================== -->

    <section class="card">

      <h2>
        賽事詳細資料
      </h2>

      <div id="bracketOutput">
        <div class="bracket-empty">
          尚未選擇賽事
        </div>
      </div>

      <details class="raw-detail">
        <summary class="muted" style="cursor:pointer;">
          查看原始賽事資料
        </summary>
        <pre id="detailOutput">尚未選擇賽事</pre>
      </details>

    </section>

  </main>


<script>

  // ==========================================================
  // 基本工具
  // ==========================================================

  const $ = (id) =>
    document.getElementById(id);


  function showStatus(
    element,
    message,
    type = ""
  ) {
    element.textContent = message;

    element.className =
      "status " +
      type;
  }


  // ==========================================================
  // API
  // ==========================================================

  async function api(
    url,
    options = {}
  ) {
    const response =
      await fetch(
        url,
        {
          credentials: "same-origin",
          ...options,
          headers: {
            "Content-Type":
              "application/json",
            ...(options.headers || {})
          }
        }
      );

    let data = null;

    try {
      data =
        await response.json();
    } catch {
      data = {};
    }

    if (!response.ok) {
      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );
    }

    return data;
  }


  // ==========================================================
  // 檢查登入
  // ==========================================================

  async function checkLogin() {

    try {

      const data =
        await api(
          "/api/me"
        );

      if (
        data.authenticated
      ) {
        showApp();
      } else {
        showLogin();
      }

    } catch {

      showLogin();

    }
  }


  function showLogin() {

    $("loginScreen")
      .classList
      .remove("hidden");

    $("app")
      .classList
      .add("hidden");
  }


  function showApp() {

    $("loginScreen")
      .classList
      .add("hidden");

    $("app")
      .classList
      .remove("hidden");

    loadTournaments();
  }


  // ==========================================================
  // 登入
  // ==========================================================

  $("loginButton")
    .addEventListener(
      "click",
      async () => {

        const password =
          $("password").value;

        if (!password) {
          showStatus(
            $("loginStatus"),
            "請輸入管理員密碼",
            "error"
          );
          return;
        }

        try {

          $("loginButton")
            .disabled = true;

          await api(
            "/api/login",
            {
              method: "POST",

              body:
                JSON.stringify({
                  password
                })
            }
          );

          showApp();

        } catch (error) {

          showStatus(
            $("loginStatus"),
            error.message,
            "error"
          );

        } finally {

          $("loginButton")
            .disabled = false;

        }

      }
    );


  // Enter 登入
  $("password")
    .addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {
          $("loginButton")
            .click();
        }

      }
    );


  // ==========================================================
  // 登出
  // ==========================================================

  $("logoutButton")
    .addEventListener(
      "click",
      async () => {

        try {

          await api(
            "/api/logout",
            {
              method: "POST"
            }
          );

        } finally {

          showLogin();

        }

      }
    );


  // ==========================================================
  // 建立賽事
  // ==========================================================

  $("createButton")
    .addEventListener(
      "click",
      async () => {

        const name =
          $("tournamentName")
            .value
            .trim();

        const format =
          $("format").value;

        const randomize =
          $("randomize").value ===
          "true";

        const participants =
          $("participants")
            .value
            .split(/\r?\n/)
            .map(
              (name) =>
                name.trim()
            )
            .filter(Boolean);

        if (!name) {

          showStatus(
            $("createStatus"),
            "請輸入賽事名稱",
            "error"
          );

          return;
        }

        if (
          participants.length < 2 ||
          participants.length > 48
        ) {

          showStatus(
            $("createStatus"),
            "參賽人數必須是 2～48 人",
            "error"
          );

          return;
        }


        try {

          $("createButton")
            .disabled = true;

          showStatus(
            $("createStatus"),
            "正在建立賽程..."
          );


          const data =
            await api(
              "/api/tournaments",
              {
                method: "POST",

                body:
                  JSON.stringify({
                    name,
                    format,
                    randomize,
                    participants
                  })
              }
            );


          showStatus(
            $("createStatus"),
            `賽事建立成功！

Tournament ID: ${data.tournamentId}`,
            "success"
          );


          await loadTournaments();

          await loadTournamentDetail(
            data.tournamentId
          );


        } catch (error) {

          showStatus(
            $("createStatus"),
            error.message,
            "error"
          );

        } finally {

          $("createButton")
            .disabled = false;

        }

      }
    );


  // ==========================================================
  // 載入賽事列表
  // ==========================================================

  // ==========================================================
  // 載入賽事列表
  // ==========================================================

  async function loadTournaments() {

    const container =
      $("tournamentList");

    try {

      const data =
        await api(
          "/api/tournaments"
        );

      const tournaments =
        data.tournaments || [];

      if (!tournaments.length) {

        container.innerHTML =
          '<div class="muted">目前沒有賽事</div>';

        return;
      }


      container.innerHTML =
        tournaments
          .map(
            (tournament) => {

              const format =
                tournament.format ===
                "single_elimination"
                  ? "單淘汰"
                  : "雙敗";

              const status =
                tournament.status ===
                "completed"
                  ? "已完成"
                  : "進行中";


              return `
                <div
                  class="tournament-item"
                >

                  <strong>
                    ${escapeHtml(
                      tournament.name
                    )}
                  </strong>


                  <div class="muted">

                    ID：
                    ${escapeHtml(
                      String(tournament.id)
                    )}

                   　
                    人數：
                    ${escapeHtml(
                      String(tournament.size || "")
                    )}

                   　
                    賽制：
                    ${escapeHtml(format)}

                   　
                    狀態：
                    ${escapeHtml(status)}

                  </div>


                  <br>


                  <div
                    class="button-row"
                  >

                    <button
                      class="secondary"
                      onclick="
                        loadTournamentDetail(
                          ${Number(tournament.id)}
                        )
                      "
                    >
                      查看賽程資料
                    </button>


                    <button
                      class="danger"
                      onclick="
                        deleteTournament(
                          ${Number(tournament.id)},
                          '${escapeHtml(
                            tournament.name
                          ).replace(/'/g, "\\'")}'
                        )
                      "
                    >
                      刪除賽程
                    </button>

                  </div>


                </div>
              `;
            }
          )
          .join("");


    } catch (error) {

      container.textContent =
        error.message;

    }

  }


  // ==========================================================
  // 刪除賽事
  // ==========================================================

  async function deleteTournament(
    tournamentId,
    tournamentName
  ) {

    const confirmed =
      confirm(
        `確定要刪除「${tournamentName}」嗎？\n\n` +
        `這個賽程以及其中所有參賽者、對戰資料都會一起刪除。\n\n` +
        `刪除後無法復原。`
      );


    if (!confirmed) {

      return;

    }


    try {

      await api(
        `/api/tournaments/${tournamentId}`,
        {
          method: "DELETE"
        }
      );


      // 如果目前正在查看被刪除的賽事，
      // 清除右側／下方的詳細資料。

      const bracketOutput =
        $("bracketOutput");

      const detailOutput =
        $("detailOutput");


      if (bracketOutput) {

        bracketOutput.innerHTML = `
          <div class="bracket-empty">
            尚未選擇賽事
          </div>
        `;

      }


      if (detailOutput) {

        detailOutput.textContent =
          "尚未選擇賽事";

      }


      // 重新載入賽事列表

      await loadTournaments();


      alert(
        `賽事「${tournamentName}」已刪除。`
      );


    } catch (error) {

      console.error(
        "刪除賽事失敗：",
        error
      );


      alert(
        error.message ||
        "刪除賽事失敗"
      );

    }

  }


  // ==========================================================
  // 取得單一賽事
  // ==========================================================

  async function loadTournamentDetail(
    tournamentId
  ) {

    const bracketOutput = $("bracketOutput");
    const detailOutput = $("detailOutput");

    bracketOutput.innerHTML = `
      <div class="bracket-empty">
        正在載入賽程...
      </div>
    `;

    try {

      const data =
        await api(
          `/api/tournaments/${tournamentId}`
        );

      detailOutput.textContent =
        JSON.stringify(
          data,
          null,
          2
        );

      renderBracket(data);

    } catch (error) {

      bracketOutput.innerHTML = `
        <div class="status error">
          ${escapeHtml(error.message)}
        </div>
      `;

      detailOutput.textContent =
        error.message;

    }
  }


  // ==========================================================
  // 繪製賽程流程圖
  // ==========================================================

  function renderBracket(data) {

    const container = $("bracketOutput");
    const tournament = data.tournament || {};
    const matches = Array.isArray(data.matches)
      ? data.matches
      : [];

    if (!matches.length) {
      container.innerHTML = `
        <div class="bracket-empty">
          這個賽事目前沒有賽程資料
        </div>
      `;
      return;
    }

    const isDouble =
      tournament.format === "double_elimination";

    const activeMatches =
      matches.filter(
        (match) =>
          match.status !== "void"
      );

    const brackets = isDouble
      ? ["winners", "losers", "grand_final"]
      : ["winners"];

    const columns = [];

    for (const bracket of brackets) {

      const bracketMatches =
        activeMatches.filter(
          (match) =>
            match.bracket === bracket
        );

      if (!bracketMatches.length) {
        continue;
      }

      const maxRound =
        Math.max(
          ...bracketMatches.map(
            (match) =>
              Number(match.round) || 1
          )
        );

      for (
        let round = 1;
        round <= maxRound;
        round++
      ) {

        const roundMatches =
          bracketMatches
            .filter(
              (match) =>
                Number(match.round) === round
            )
            .sort(
              (a, b) =>
                Number(a.position) -
                Number(b.position)
            );

        if (!roundMatches.length) {
          continue;
        }

        columns.push({
          bracket,
          round,
          matches: roundMatches
        });
      }
    }

    const bracketLabel = {
      winners: isDouble ? "勝部" : "",
      losers: "敗部",
      grand_final: "總決賽"
    };

    const board =
      columns
        .map(
          (column) => {

            const roundName =
              column.bracket === "grand_final"
                ? "總決賽"
                : column.bracket === "losers"
                  ? `敗部 R${column.round}`
                  : `第 ${column.round} 輪`;

            const title =
              bracketLabel[column.bracket]
                ? `${bracketLabel[column.bracket]} · ${roundName}`
                : roundName;

            const matchesHtml =
              column.matches
                .map(
                  (match) =>
                    renderMatchCard(
                      match
                    )
                )
                .join("");

            /*
             * 每往後一輪，讓對戰卡片間距放大，
             * 讓下一輪自然位於上一輪兩場比賽的中間。
             */
            const spacing =
              Math.max(
                0,
                Math.pow(
                  2,
                  column.round - 1
                ) - 1
              ) * 48;

            const firstOffset =
              Math.max(
                0,
                Math.pow(
                  2,
                  column.round - 1
                ) - 1
              ) * 24;

            return `
              <div class="bracket-column">
                <div class="bracket-column-title">
                  ${escapeHtml(title)}
                </div>

                <div
                  class="bracket-matches"
                  style="
                    padding-top:${firstOffset}px;
                    gap:${spacing}px;
                  "
                >
                  ${matchesHtml}
                </div>
              </div>
            `;
          }
        )
        .join("");

    const formatText =
      tournament.format === "single_elimination"
        ? "單淘汰"
        : "雙敗";

    const statusText =
      tournament.status === "completed"
        ? "已完成"
        : "進行中";

    container.innerHTML = `
      <div class="bracket-wrapper">

        <div class="bracket-header">

          <div class="bracket-title">
            ${escapeHtml(
              tournament.name ||
              "未命名賽事"
            )}
          </div>

          <div class="bracket-meta">
            ${escapeHtml(formatText)}
            ・
            ${escapeHtml(String(tournament.size || ""))}
            人
            ・
            ${escapeHtml(statusText)}
          </div>

        </div>

        <div class="bracket-board">
          ${board}
        </div>

      </div>
    `;
  }


  function renderMatchCard(match) {

    const isBye =
      Number(match.is_bye_match) === 1;

    const participant1 =
      match.participant1_name ||
      "";

    const participant2 =
      match.participant2_name ||
      "";

    const score1 =
      match.score1 === null ||
      match.score1 === undefined
        ? ""
        : match.score1;

    const score2 =
      match.score2 === null ||
      match.score2 === undefined
        ? ""
        : match.score2;

    const winnerId =
      match.winner_id === null ||
      match.winner_id === undefined
        ? null
        : Number(match.winner_id);

    const p1Id =
      match.participant1_id === null ||
      match.participant1_id === undefined
        ? null
        : Number(match.participant1_id);

    const p2Id =
      match.participant2_id === null ||
      match.participant2_id === undefined
        ? null
        : Number(match.participant2_id);

    const status =
      match.status || "pending";

    let statusText = "待賽";
    let statusClass = "";

    if (isBye) {
      statusText = "BYE・自動晉級";
      statusClass = "bye-text";
    } else if (status === "ready") {
      statusText = "可進行";
      statusClass = "ready-text";
    } else if (status === "completed") {
      statusText = "已完成";
    } else if (
      participant1 &&
      participant2
    ) {
      statusText = "待賽";
    } else {
      statusText = "等待上一輪結果";
    }

    const cardClass =
      [
        "match-card",
        isBye ? "bye" : "",
        status === "ready"
          ? "ready"
          : "",
        status === "completed"
          ? "completed"
          : ""
      ]
        .filter(Boolean)
        .join(" ");

    const p1Class =
      p1Id !== null &&
      winnerId === p1Id
        ? "player-name winner"
        : participant1
          ? "player-name"
          : "player-name empty";

    const p2Class =
      p2Id !== null &&
      winnerId === p2Id
        ? "player-name winner"
        : participant2
          ? "player-name"
          : "player-name empty";

    return `
      <div
        class="${cardClass}"
        data-match-id="${escapeHtml(
          String(match.id)
        )}"
      >

        <div class="match-label">
          #${escapeHtml(
            String(match.id)
          )}
          ・
          場次 ${escapeHtml(
            String(match.position)
          )}
        </div>

        <div class="player-row">
          <span class="${p1Class}">
            ${escapeHtml(
              participant1 || "尚未產生"
            )}
          </span>

          <span class="player-score">
            ${escapeHtml(
              String(score1)
            )}
          </span>
        </div>

        <div class="player-row">
          <span class="${p2Class}">
            ${escapeHtml(
              participant2 || (
                isBye
                  ? "BYE"
                  : "尚未產生"
              )
            )}
          </span>

          <span class="player-score">
            ${escapeHtml(
              String(score2)
            )}
          </span>
        </div>

        <div class="match-status ${statusClass}">
          ${escapeHtml(statusText)}
        </div>

      </div>
    `;
  }


  // ==========================================================
  // HTML escape
  // ==========================================================

  function escapeHtml(
    value
  ) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  // ==========================================================
  // 啟動
  // ==========================================================

  checkLogin();

</script>
