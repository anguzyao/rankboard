<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Corner X 賽程安排器</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #eee;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    .container {
      width: min(100% - 32px, 900px);
      margin: 0 auto;
      padding: 32px 0 60px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: 800;
    }

    .subtitle {
      color: #999;
      margin-bottom: 28px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #bbb;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #444;
      background: #0f0f0f;
      color: #fff;
      border-radius: 9px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #8cff00;
    }

    textarea {
      min-height: 260px;
      resize: vertical;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #8cff00;
      color: #111;
    }

    .secondary {
      background: #333;
      color: #fff;
    }

    .danger {
      background: #d93636;
      color: #fff;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #111;
      border: 1px solid #333;
      white-space: pre-wrap;
    }

    .success {
      border-color: #8cff00;
      color: #bfff66;
    }

    .error {
      border-color: #d93636;
      color: #ff7777;
    }

    .tournament-item {
      border: 1px solid #333;
      background: #111;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .tournament-item strong {
      display: block;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .muted {
      color: #888;
      font-size: 13px;
    }

    pre {
      background: #0b0b0b;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 16px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.5;
      color: #ddd;
    }

    /* ==========================================================
       賽程流程圖
       ========================================================== */

    .bracket-wrapper {
      margin-top: 18px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #0b0b0b;
      padding: 18px;
      overflow-x: auto;
    }

    .bracket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .bracket-title {
      font-size: 18px;
      font-weight: 800;
    }

    .bracket-meta {
      color: #888;
      font-size: 13px;
      white-space: nowrap;
    }

    /*
     * 新版賽程區：
     * 不再用固定 gap / padding-top 推算位置。
     * 每一列代表一個「第一輪場次高度」，
     * 後面的輪次直接跨越 2、4、8 列，
     * 因此會自然落在前一輪兩場比賽的正中央。
     */
    .bracket-board {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 24px;
      min-width: max-content;
      padding: 8px 4px 25px;
    }

    .bracket-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 0;
    }

    .bracket-line {
      fill: none;
      stroke: #4b5644;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.9;
    }

    .bracket-line.active {
      stroke: #8cff00;
      opacity: 1;
    }

    .bracket-column {
      width: 190px;
      flex: 0 0 190px;
    }

    .bracket-column-title {
      text-align: center;
      color: #bfff66;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 14px;
      padding: 8px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #151515;
    }

    .bracket-matches {
      display: grid;
      grid-template-rows: repeat(var(--slot-count), 130px);
      position: relative;
    }

    .match-slot {
      position: relative;
      align-self: stretch;
      min-width: 0;
    }

    .match-card {
      position: relative;
      align-self: center;
      top: 50%;
      transform: translateY(-50%);
      border: 1px solid #444;
      border-radius: 9px;
      overflow: visible;
      background: #151515;
      min-height: 82px;
      z-index: 1;
    }

    .match-card::after {
      content: "";
      position: absolute;
      right: -25px;
      top: 50%;
      width: 24px;
      height: 1px;
      background: #555;
    }

    .match-card::before {
      content: "";
      position: absolute;
      left: -13px;
      top: 50%;
      width: 13px;
      height: 1px;
      background: #555;
    }

    .bracket-column:first-child .match-card::before {
      display: none;
    }

    .bracket-column:last-child .match-card::after {
      display: none;
    }

    .match-card.bye {
      border-color: #53613d;
      background: #12170e;
    }

    .match-card.ready {
      border-color: #8cff00;
      box-shadow:
        0 0 0 1px rgba(140, 255, 0, 0.08);
    }

    .match-card.completed {
      border-color: #555;
    }

    .match-label {
      padding: 5px 9px;
      font-size: 11px;
      color: #777;
      border-bottom: 1px solid #2d2d2d;
    }

    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      min-height: 28px;
      font-size: 13px;
    }

    .player-row + .player-row {
      border-top: 1px solid #292929;
    }

    .player-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-name.winner {
      color: #bfff66;
      font-weight: 800;
    }

    .player-name.empty {
      color: #555;
      font-style: italic;
    }

    .player-score {
      min-width: 20px;
      text-align: right;
      color: #aaa;
      font-variant-numeric: tabular-nums;
    }

    .match-status {
      padding: 5px 9px 7px;
      color: #777;
      font-size: 11px;
    }

    .match-status.ready-text {
      color: #bfff66;
    }

    .match-status.bye-text {
      color: #9aaa7b;
    }

    /* ==========================================================
       冠軍
       ========================================================== */

    .champion-column {
      position: relative;
      z-index: 1;
      width: 190px;
      flex: 0 0 190px;
    }

    .champion-matches {
      display: grid;
      grid-template-rows: repeat(var(--slot-count), 130px);
      position: relative;
    }

    .champion-slot {
      position: relative;
      align-self: stretch;
      min-width: 0;
    }

    .champion-slot .champion-card {
      position: relative;
      top: 50%;
      transform: translateY(-50%);
    }

    .champion-title {
      text-align: center;
      color: #bfff66;
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 14px;
      padding: 8px;
      border: 1px solid #8cff00;
      border-radius: 8px;
      background: #151b0f;
    }

    .champion-card {
      position: relative;
      border: 1px solid #8cff00;
      border-radius: 12px;
      background: linear-gradient(180deg, #17200f, #10150d);
      padding: 18px 12px;
      text-align: center;
      box-shadow: 0 0 20px rgba(140, 255, 0, 0.08);
    }

    .champion-card::before {
      display: none;
    }

    .trophy {
      font-size: 28px;
      margin-bottom: 7px;
    }

    .champion-label {
      color: #9aaa7b;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .champion-name {
      color: #bfff66;
      font-size: 18px;
      font-weight: 900;
      word-break: break-word;
    }

    @media (max-width: 600px) {
      .bracket-wrapper {
        padding: 12px;
      }

      .bracket-column,
      .champion-column {
        width: 175px;
        flex-basis: 175px;
      }

      .bracket-board {
        gap: 20px;
      }

      .bracket-meta {
        white-space: normal;
        text-align: right;
      }
    }

    .login-box {
      max-width: 420px;
      margin: 80px auto;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 20px, 900px);
        padding-top: 20px;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 16px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <!-- ======================================================
       登入
  ======================================================= -->

  <div
    id="loginScreen"
    class="login-box"
  >
    <div class="card">

      <h1>Corner X</h1>

      <div class="subtitle">
        賽程安排器
      </div>

      <div class="field">

        <label>
          管理員密碼
        </label>

        <input
          id="password"
          type="password"
          placeholder="輸入管理員密碼"
        />

      </div>

      <button
        id="loginButton"
        class="primary"
      >
        登入
      </button>

      <div
        id="loginStatus"
        class="status hidden"
      ></div>

    </div>
  </div>


  <!-- ======================================================
       管理介面
  ======================================================= -->

  <main
    id="app"
    class="container hidden"
  >

    <h1>
      Corner X 賽程安排器
    </h1>

    <div class="subtitle">
      目前為功能測試版
    </div>


    <!-- ====================================================
         建立賽事
    ===================================================== -->

    <section class="card">

      <h2>
        建立新賽事
      </h2>

      <div class="field">

        <label>
          賽事名稱
        </label>

        <input
          id="tournamentName"
          type="text"
          placeholder="例如：第二屆渣男陀螺盃"
        />

      </div>


      <div class="row">

        <div class="field">

          <label>
            賽制
          </label>

          <select id="format">

            <option value="single_elimination">
              單淘汰
            </option>

            <option value="double_elimination">
              雙敗
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            排序
          </label>

          <select id="randomize">

            <option value="false">
              保持輸入順序
            </option>

            <option value="true">
              隨機洗牌
            </option>

          </select>

        </div>

      </div>


      <div class="field">

        <label>
          參賽者
          <span class="muted">
            一行一位，2～48 人
          </span>
        </label>

        <textarea
          id="participants"
          placeholder="Angus
小明
小華
阿杰
阿倫
阿凱
阿翔
阿偉"
        ></textarea>

      </div>


      <div class="button-row">

        <button
          id="createButton"
          class="primary"
        >
          建立賽事
        </button>

        <button
          id="logoutButton"
          class="secondary"
        >
          登出
        </button>

      </div>


      <div
        id="createStatus"
        class="status hidden"
      ></div>

    </section>


    <!-- ====================================================
         現有賽事
    ===================================================== -->

    <section class="card">

      <h2>
        現有賽事
      </h2>

      <div id="tournamentList">
        載入中...
      </div>

    </section>


    <!-- ====================================================
         賽事資料
    ===================================================== -->

    <section class="card">

      <h2>
        賽事詳細資料
      </h2>

      <div id="bracketOutput">
        <div class="bracket-empty">
          尚未選擇賽事
        </div>
      </div>

      <details class="raw-detail">
        <summary
          class="muted"
          style="cursor:pointer;"
        >
          查看原始賽事資料
        </summary>

        <pre id="detailOutput">
尚未選擇賽事
        </pre>
      </details>

    </section>

  </main>


<script>

  // ==========================================================
  // 基本工具
  // ==========================================================

  const $ = (id) =>
    document.getElementById(id);


  function showStatus(
    element,
    message,
    type = ""
  ) {

    element.textContent =
      message;

    element.className =
      "status " + type;

  }


  // ==========================================================
  // API
  // ==========================================================

  async function api(
    url,
    options = {}
  ) {

    const response =
      await fetch(
        url,
        {
          credentials: "same-origin",
          ...options,

          headers: {
            "Content-Type":
              "application/json",
            ...(options.headers || {})
          }
        }
      );

    let data = null;

    try {

      data =
        await response.json();

    } catch {

      data = {};

    }

    if (!response.ok) {

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }

    return data;
  }


  // ==========================================================
  // 檢查登入
  // ==========================================================

  async function checkLogin() {

    try {

      const data =
        await api(
          "/api/me"
        );

      if (
        data.authenticated
      ) {

        showApp();

      } else {

        showLogin();

      }

    } catch {

      showLogin();

    }

  }


  function showLogin() {

    $("loginScreen")
      .classList
      .remove("hidden");

    $("app")
      .classList
      .add("hidden");

  }


  function showApp() {

    $("loginScreen")
      .classList
      .add("hidden");

    $("app")
      .classList
      .remove("hidden");

    loadTournaments();

  }


  // ==========================================================
  // 登入
  // ==========================================================

  $("loginButton")
    .addEventListener(
      "click",
      async () => {

        const password =
          $("password").value;

        if (!password) {

          showStatus(
            $("loginStatus"),
            "請輸入管理員密碼",
            "error"
          );

          return;
        }

        try {

          $("loginButton")
            .disabled = true;

          await api(
            "/api/login",
            {
              method: "POST",

              body:
                JSON.stringify({
                  password
                })
            }
          );

          showApp();

        } catch (error) {

          showStatus(
            $("loginStatus"),
            error.message,
            "error"
          );

        } finally {

          $("loginButton")
            .disabled = false;

        }

      }
    );


  // Enter 登入

  $("password")
    .addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          $("loginButton")
            .click();

        }

      }
    );


  // ==========================================================
  // 登出
  // ==========================================================

  $("logoutButton")
    .addEventListener(
      "click",
      async () => {

        try {

          await api(
            "/api/logout",
            {
              method: "POST"
            }
          );

        } finally {

          showLogin();

        }

      }
    );


  // ==========================================================
  // 建立賽事
  // ==========================================================

  $("createButton")
    .addEventListener(
      "click",
      async () => {

        const name =
          $("tournamentName")
            .value
            .trim();

        const format =
          $("format").value;

        const randomize =
          $("randomize").value ===
          "true";

        const participants =
          $("participants")
            .value
            .split(/\r?\n/)
            .map(
              (name) =>
                name.trim()
            )
            .filter(Boolean);

        if (!name) {

          showStatus(
            $("createStatus"),
            "請輸入賽事名稱",
            "error"
          );

          return;

        }

        if (
          participants.length < 2 ||
          participants.length > 48
        ) {

          showStatus(
            $("createStatus"),
            "參賽人數必須是 2～48 人",
            "error"
          );

          return;

        }

        try {

          $("createButton")
            .disabled = true;

          showStatus(
            $("createStatus"),
            "正在建立賽程..."
          );

          const data =
            await api(
              "/api/tournaments",
              {
                method: "POST",

                body:
                  JSON.stringify({
                    name,
                    format,
                    randomize,
                    participants
                  })
              }
            );

          showStatus(
            $("createStatus"),
            `賽事建立成功！

Tournament ID: ${data.tournamentId}`,
            "success"
          );

          await loadTournaments();

          await loadTournamentDetail(
            data.tournamentId
          );

        } catch (error) {

          showStatus(
            $("createStatus"),
            error.message,
            "error"
          );

        } finally {

          $("createButton")
            .disabled = false;

        }

      }
    );


 // ==========================================================
// 載入賽事列表
// ==========================================================

async function loadTournaments() {

  const container =
    $("tournamentList");

  try {

    const data =
      await api(
        "/api/tournaments"
      );

    const tournaments =
      data.tournaments || [];

    if (!tournaments.length) {

      container.innerHTML =
        '<div class="muted">目前沒有賽事</div>';

      return;
    }


    container.innerHTML =
      tournaments
        .map(
          (tournament) => {

            const format =
              tournament.format ===
              "single_elimination"
                ? "單淘汰"
                : "雙敗";

            const status =
              tournament.status ===
              "completed"
                ? "已完成"
                : "進行中";


            return `
              <div
                class="tournament-item"
              >

                <strong>
                  ${escapeHtml(
                    tournament.name
                  )}
                </strong>


                <div class="muted">

                  ID：
                  ${escapeHtml(
                    String(tournament.id)
                  )}

                  　
                  人數：
                  ${escapeHtml(
                    String(tournament.size || "")
                  )}

                  　
                  賽制：
                  ${escapeHtml(format)}

                  　
                  狀態：
                  ${escapeHtml(status)}

                </div>


                <br>


                <div
                  class="button-row"
                >

                  <button
                    class="secondary"
                    onclick="
                      loadTournamentDetail(
                        ${Number(tournament.id)}
                      )
                    "
                  >
                    查看賽程資料
                  </button>


                  <button
                    class="secondary"
                    onclick="
                      randomizeTournament(
                        ${Number(tournament.id)},
                        this
                      )
                    "
                  >
                    🎲 隨機排列
                  </button>


                  <button
                    class="secondary"
                    onclick="
                      copyPublicTournamentUrl(
                        ${Number(tournament.id)},
                        this
                      )
                    "
                  >
                    👁 分享公開賽程
                  </button>


                  <button
                    class="danger"
                    onclick="
                      deleteTournament(
                        ${Number(tournament.id)},
                        '${escapeHtml(
                          tournament.name
                        ).replace(/'/g, "\\'")}'
                      )
                    "
                  >
                    刪除賽程
                  </button>

                </div>


              </div>
            `;
          }
        )
        .join("");


  } catch (error) {

    container.textContent =
      error.message;

  }

}


// ==========================================================
// 開啟公開賽程
// ==========================================================

// ==========================================================
// 複製公開賽程網址
// ==========================================================

async function randomizeTournament(
  tournamentId,
  button
) {

  const originalText =
    button.textContent;

  try {

    button.disabled = true;
    button.textContent =
      "🎲 排列中...";

    await api(
      `/api/tournaments/${tournamentId}/randomize`,
      {
        method: "POST"
      }
    );

    button.textContent =
      "✅ 已重新排列";

    await loadTournaments();
    await loadTournamentDetail(
      tournamentId
    );

    setTimeout(() => {
      button.textContent =
        originalText;
    }, 1500);

  } catch (error) {

    console.error(
      "隨機排列失敗：",
      error
    );

    button.disabled = false;
    button.textContent =
      originalText;

    alert(
      error.message ||
      "隨機排列失敗"
    );
  }

}


async function copyPublicTournamentUrl(
  tournamentId,
  button
) {

  const publicUrl =
    `${window.location.origin}/tournament-view.html?id=${tournamentId}`;

  try {

    await navigator.clipboard.writeText(
      publicUrl
    );

    const originalText =
      button.textContent;

    button.textContent =
      "✅ 已複製網址";

    setTimeout(() => {

      button.textContent =
        originalText;

    }, 1500);

  } catch (error) {

    console.error(
      "複製網址失敗：",
      error
    );

    alert(
      `複製失敗，請手動複製：\n\n${publicUrl}`
    );

  }

}


  // ==========================================================
  // 刪除賽事
  // ==========================================================

  async function deleteTournament(
    tournamentId,
    tournamentName
  ) {

    const confirmed =
      confirm(
        `確定要刪除「${tournamentName}」嗎？\n\n` +
        `這個賽程以及其中所有參賽者、對戰資料都會一起刪除。\n\n` +
        `刪除後無法復原。`
      );

    if (!confirmed) {

      return;

    }

    try {

      await api(
        `/api/tournaments/${tournamentId}`,
        {
          method: "DELETE"
        }
      );

      const bracketOutput =
        $("bracketOutput");

      const detailOutput =
        $("detailOutput");

      if (bracketOutput) {

        bracketOutput.innerHTML = `
          <div class="bracket-empty">
            尚未選擇賽事
          </div>
        `;

      }

      if (detailOutput) {

        detailOutput.textContent =
          "尚未選擇賽事";

      }

      await loadTournaments();

      alert(
        `賽事「${tournamentName}」已刪除。`
      );

    } catch (error) {

      console.error(
        "刪除賽事失敗：",
        error
      );

      alert(
        error.message ||
        "刪除賽事失敗"
      );

    }

  }


  // ==========================================================
  // 取得單一賽事
  // ==========================================================

  async function loadTournamentDetail(
    tournamentId
  ) {

    const bracketOutput =
      $("bracketOutput");

    const detailOutput =
      $("detailOutput");

    bracketOutput.innerHTML = `
      <div class="bracket-empty">
        正在載入賽程...
      </div>
    `;

    try {

      const data =
        await api(
          `/api/tournaments/${tournamentId}`
        );

      detailOutput.textContent =
        JSON.stringify(
          data,
          null,
          2
        );

      renderBracket(data);

    } catch (error) {

      bracketOutput.innerHTML = `
        <div class="status error">
          ${escapeHtml(
            error.message
          )}
        </div>
      `;

      detailOutput.textContent =
        error.message;

    }

  }


  // ==========================================================
  // 繪製賽程流程圖
  // ==========================================================

  function renderBracket(data) {

    const container =
      $("bracketOutput");

    const tournament =
      data.tournament || {};

    const matches =
      Array.isArray(data.matches)
        ? data.matches
        : [];

    if (!matches.length) {

      container.innerHTML = `
        <div class="bracket-empty">
          這個賽事目前沒有賽程資料
        </div>
      `;

      return;
    }

    const isDouble =
      tournament.format ===
      "double_elimination";

    const activeMatches =
      matches.filter(
        (match) =>
          match.status !== "void"
      );

    const brackets =
      isDouble
        ? [
            "winners",
            "losers",
            "grand_final"
          ]
        : [
            "winners"
          ];

    const columns = [];

    for (
      const bracket of brackets
    ) {

      const bracketMatches =
        activeMatches.filter(
          (match) =>
            match.bracket ===
            bracket
        );

      if (
        !bracketMatches.length
      ) {

        continue;

      }

      const maxRound =
        Math.max(
          ...bracketMatches.map(
            (match) =>
              Number(
                match.round
              ) || 1
          )
        );

      /*
       * 以第一輪實際場次作為整個 bracket 的基準。
       *
       * 例如 15 人：
       *
       * 第1輪 = 8 場
       * 第2輪 = 每場跨 2 格
       * 第3輪 = 每場跨 4 格
       * 第4輪 = 每場跨 8 格
       *
       * 因此每一輪都會自動落在前一輪兩場的正中央。
       */

      const firstRoundCount =
        Math.max(
          1,
          bracketMatches.filter(
            (match) =>
              Number(
                match.round
              ) === 1
          ).length
        );

      for (
        let round = 1;
        round <= maxRound;
        round++
      ) {

        const roundMatches =
          bracketMatches
            .filter(
              (match) =>
                Number(
                  match.round
                ) === round
            )
            .sort(
              (a, b) =>
                Number(
                  a.position
                ) -
                Number(
                  b.position
                )
            );

        if (
          !roundMatches.length
        ) {

          continue;

        }

        columns.push({
          bracket,
          round,
          matches:
            roundMatches,
          slotCount:
            firstRoundCount
        });

      }

    }


    const bracketLabel = {

      winners:
        isDouble
          ? "勝部"
          : "",

      losers:
        "敗部",

      grand_final:
        "總決賽"

    };


    const board =
      columns
        .map(
          (column) => {

            const roundName =
              column.bracket ===
              "grand_final"

                ? "總決賽"

                : column.bracket ===
                  "losers"

                  ? `敗部 R${column.round}`

                  : `第 ${column.round} 輪`;


            const title =
              bracketLabel[
                column.bracket
              ]

                ? `${
                    bracketLabel[
                      column.bracket
                    ]
                  } · ${roundName}`

                : roundName;


            const matchesHtml =
              column.matches
                .map(
                  (match) => {

                    const position =
                      Number(
                        match.position
                      ) || 1;

                    const span =
                      Math.pow(
                        2,
                        column.round - 1
                      );

                    const start =
                      (position - 1) *
                        span +
                      1;

                    return `
                      <div
                        class="match-slot"
                        data-match-id="${Number(match.id)}"
                        style="
                          grid-row:
                            ${start}
                            / span
                            ${span};
                        "
                      >

                        ${renderMatchCard(
                          match,
                          tournament.id
                        )}

                      </div>
                    `;

                  }
                )
                .join("");


            return `
              <div
                class="bracket-column"
              >

                <div
                  class="bracket-column-title"
                >
                  ${escapeHtml(
                    title
                  )}
                </div>

                <div
                  class="bracket-matches"
                  style="
                    --slot-count:
                      ${column.slotCount};
                  "
                >

                  ${matchesHtml}

                </div>

              </div>
            `;

          }
        )
        .join("");


    const formatText =
      tournament.format ===
      "single_elimination"

        ? "單淘汰"

        : "雙敗";


    const statusText =
      tournament.status ===
      "completed"

        ? "已完成"

        : "進行中";


    /*
     * ========================================================
     * 找冠軍
     *
     * 第一優先：
     * tournaments.champion_id
     *
     * 第二優先：
     * 最後一場 winners match 的 winner_id
     *
     * 這樣即使 API 尚未附帶 participants，
     * 也可以從決賽直接找到冠軍姓名。
     * ========================================================
     */

    const championId =
      tournament.champion_id ===
        null ||
      tournament.champion_id ===
        undefined

        ? null

        : Number(
            tournament.champion_id
          );


    let championName = "";


    const participantList =
      Array.isArray(
        data.participants
      )
        ? data.participants
        : [];


    if (
      championId !== null
    ) {

      const champion =
        participantList.find(
          (participant) =>
            Number(
              participant.id
            ) === championId
        );

      if (champion) {

        championName =
          champion.name ||
          champion.participant_name ||
          "";

      }

    }


    /*
     * 如果 participants 沒有資料，
     * 從最後一場比賽的 winner_id 找名字。
     */

    if (
      !championName
    ) {

      const finalMatch =
        activeMatches
          .filter(
            (match) =>
              match.bracket ===
                "winners" &&
              !match.next_match_id
          )
          .sort(
            (a, b) =>
              Number(
                b.round
              ) -
              Number(
                a.round
              )
          )[0];


      if (
        finalMatch &&
        finalMatch.winner_id
      ) {

        const winnerId =
          Number(
            finalMatch.winner_id
          );


        if (
          winnerId ===
          Number(
            finalMatch.participant1_id
          )
        ) {

          championName =
            finalMatch
              .participant1_name ||
            "";

        } else if (
          winnerId ===
          Number(
            finalMatch.participant2_id
          )
        ) {

          championName =
            finalMatch
              .participant2_name ||
            "";

        }

      }

    }


    const isCompleted =
      tournament.status ===
        "completed" &&
      Boolean(
        championName
      );


    /*
     * ========================================================
     * 冠軍位置
     *
     * 不再用固定 margin-top。
     * 直接抓最後一場真正的決賽，並使用與 bracket 相同的
     * grid-row 計算方式，讓冠軍卡自動落在決賽正中央。
     *
     * 單淘汰：對齊最後一輪
     * 雙敗：對齊總決賽 / 最後一場決定冠軍的比賽
     * ========================================================
     */

    let finalMatchForChampion = null;

    const completedFinalCandidates =
      activeMatches
        .filter(
          (match) =>
            (
              match.bracket === "winners" ||
              match.bracket === "grand_final"
            ) &&
            !match.next_match_id &&
            match.winner_id
        )
        .sort(
          (a, b) => {
            const roundDiff =
              Number(b.round || 0) -
              Number(a.round || 0);

            if (roundDiff !== 0) {
              return roundDiff;
            }

            return Number(b.id || 0) -
              Number(a.id || 0);
          }
        );

    if (completedFinalCandidates.length) {
      finalMatchForChampion =
        completedFinalCandidates[0];
    }

    /*
     * 如果上面沒有找到，就退回目前 columns 的最後一場。
     * 這只是定位用途，不會影響冠軍姓名判斷。
     */
    if (!finalMatchForChampion && columns.length) {
      const lastColumn =
        columns[columns.length - 1];

      if (lastColumn && lastColumn.matches.length) {
        finalMatchForChampion =
          lastColumn.matches
            .slice()
            .sort(
              (a, b) =>
                Number(b.position || 0) -
                Number(a.position || 0)
            )[0];
      }
    }

    let championColumn = null;
    let championStart = 1;
    let championSpan = 1;

    if (finalMatchForChampion) {

      championColumn =
        columns.find(
          (column) =>
            column.matches.some(
              (match) =>
                Number(match.id) ===
                Number(finalMatchForChampion.id)
            )
        ) || null;

      if (!championColumn && columns.length) {
        championColumn =
          columns[columns.length - 1];
      }

      if (championColumn) {
        const finalPosition =
          Number(
            finalMatchForChampion.position
          ) || 1;

        championSpan =
          Math.pow(
            2,
            Math.max(
              0,
              Number(championColumn.round) - 1
            )
          );

        championStart =
          (finalPosition - 1) *
            championSpan +
          1;
      }
    }

    const finalColumn =
      columns
        .filter((column) =>
          isDouble
            ? column.bracket === "grand_final"
            : column.bracket === "winners"
        )
        .sort(
          (a, b) =>
            Number(b.round) - Number(a.round)
        )[0] || null;

    const finalSlotCount =
      finalColumn
        ? Number(finalColumn.slotCount) || 1
        : 1;

    const championHtml =
      isCompleted
        ? `
          <div class="champion-column">

            <div class="champion-title">
              🏆 冠軍
            </div>

            <div
              class="champion-matches"
              style="--slot-count: ${finalSlotCount};"
            >

              <div
                class="champion-slot"
                style="grid-row: 1 / span ${finalSlotCount};"
              >

                <div
                  class="champion-card"
                  data-champion-card="true"
                >

                  <div class="trophy">
                    🏆
                  </div>

                  <div class="champion-label">
                    本屆冠軍
                  </div>

                  <div class="champion-name">
                    ${escapeHtml(championName)}
                  </div>

                </div>

              </div>

            </div>

          </div>
        `
        : "";

    container.innerHTML = `
      <div
        class="bracket-wrapper"
      >

        <div
          class="bracket-header"
        >

          <div
            class="bracket-title"
          >
            ${escapeHtml(
              tournament.name ||
              "未命名賽事"
            )}
          </div>

          <div
            class="bracket-meta"
          >

            ${escapeHtml(
              formatText
            )}

            ・

            ${escapeHtml(
              String(
                tournament.size || ""
              )
            )}

            人

            ・

            ${escapeHtml(
              statusText
            )}

          </div>

        </div>


        <div
          class="bracket-board"
        >

          <svg
            class="bracket-lines"
            aria-hidden="true"
          ></svg>

          ${board}

          ${championHtml}

        </div>

      </div>
    `;

    requestAnimationFrame(() => {
      drawBracketLines(activeMatches);
    });

  }


  /* ========================================================
     Bracket 自動連線

     依照 next_match_id / loser_next_match_id 自動繪製。
     同時把最後一場連到冠軍卡。
     ======================================================== */

  function drawBracketLines(matches) {

    const board = document.querySelector(".bracket-board");
    const svg = board?.querySelector(".bracket-lines");

    if (!board || !svg) return;

    const boardRect = board.getBoundingClientRect();
    const width = Math.max(board.scrollWidth, boardRect.width);
    const height = Math.max(board.scrollHeight, boardRect.height);

    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("width", String(width));
    svg.setAttribute("height", String(height));
    svg.innerHTML = "";

    const matchMap = new Map(
      matches.map((match) => [Number(match.id), match])
    );

    function getCenter(element, side) {
      if (!element) return null;
      const rect = element.getBoundingClientRect();
      return {
        x:
          side === "right"
            ? rect.right - boardRect.left
            : rect.left - boardRect.left,
        y:
          rect.top - boardRect.top + rect.height / 2
      };
    }

    function drawPath(d, active) {
      const path = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );
      path.setAttribute(
        "class",
        active ? "bracket-line active" : "bracket-line"
      );
      path.setAttribute("d", d);
      svg.appendChild(path);
    }

    /*
     * 每一個目標比賽只建立一次匯流線。
     * 兩個來源進入同一場時：
     *
     *   ─────┐
     *        │
     *   ─────┘─────
     *
     * 不再讓兩條 H-V-H 路徑彼此重疊。
     */
    const connections = new Map();

    for (const match of matches) {
      const targetIds = new Set();

      if (match.next_match_id) {
        targetIds.add(Number(match.next_match_id));
      }

      if (match.loser_next_match_id) {
        targetIds.add(Number(match.loser_next_match_id));
      }

      for (const targetId of targetIds) {
        if (!matchMap.has(targetId)) continue;

        if (!connections.has(targetId)) {
          connections.set(targetId, []);
        }

        connections.get(targetId).push(match);
      }
    }

    for (const [targetId, sourceMatches] of connections) {
      const targetMatch = matchMap.get(targetId);
      const targetSlot = board.querySelector(
        `.match-slot[data-match-id="${targetId}"]`
      );
      const targetCard = targetSlot?.querySelector(".match-card");
      const target = getCenter(targetCard, "left");

      if (!target) continue;

      const sources = [];

      for (const sourceMatch of sourceMatches) {
        const sourceSlot = board.querySelector(
          `.match-slot[data-match-id="${Number(sourceMatch.id)}"]`
        );
        const sourceCard = sourceSlot?.querySelector(".match-card");
        const source = getCenter(sourceCard, "right");

        if (!source) continue;

        sources.push({
          source,
          active:
            sourceMatch.status === "ready" ||
            sourceMatch.status === "in_progress" ||
            targetMatch.status === "ready" ||
            targetMatch.status === "in_progress"
        });
      }

      if (!sources.length) continue;

      sources.sort((a, b) => a.source.y - b.source.y);

      if (sources.length === 1) {
        const item = sources[0];
        drawPath(
          `M ${item.source.x} ${item.source.y} H ${target.x}`,
          item.active
        );
        continue;
      }

      const minY = sources[0].source.y;
      const maxY = sources[sources.length - 1].source.y;
      const maxSourceX = Math.max(
        ...sources.map((item) => item.source.x)
      );

      const busX =
        maxSourceX +
        Math.max(16, (target.x - maxSourceX) / 2);

      const anyActive = sources.some(
        (item) => item.active
      );

      for (const item of sources) {
        drawPath(
          `M ${item.source.x} ${item.source.y} H ${busX}`,
          item.active
        );
      }

      drawPath(
        `M ${busX} ${minY} V ${maxY}`,
        anyActive
      );

      drawPath(
        `M ${busX} ${target.y} H ${target.x}`,
        anyActive
      );
    }

    /* 最後一場 → 冠軍 */
    const finalMatches = matches.filter(
      (match) =>
        (
          match.bracket === "winners" ||
          match.bracket === "grand_final"
        ) &&
        (
          !match.next_match_id ||
          match.is_grand_final
        )
    );

    const finalMatch = finalMatches.sort(
      (a, b) => Number(b.round) - Number(a.round)
    )[0];

    const championCard = board.querySelector(
      "[data-champion-card=\"true\"]"
    );

    if (finalMatch && championCard) {
      const sourceSlot = board.querySelector(
        `.match-slot[data-match-id="${Number(finalMatch.id)}"]`
      );
      const sourceCard = sourceSlot?.querySelector(".match-card");
      const start = getCenter(sourceCard, "right");
      const end = getCenter(championCard, "left");

      if (start && end) {
        const active =
          finalMatch.status === "ready" ||
          finalMatch.status === "in_progress" ||
          finalMatch.status === "completed";

        drawPath(
          `M ${start.x} ${start.y} H ${end.x}`,
          active
        );
      }
    }
  }


  // ==========================================================
  // 比賽卡片
  // ==========================================================

  function renderMatchCard(
    match,
    tournamentId
  ) {

    const isBye =
      Number(
        match.is_bye_match
      ) === 1;

    const participant1 =
      match.participant1_name ||
      "";

    const participant2 =
      match.participant2_name ||
      "";

    const score1 =
      match.score1 === null ||
      match.score1 === undefined
        ? ""
        : match.score1;

    const score2 =
      match.score2 === null ||
      match.score2 === undefined
        ? ""
        : match.score2;

    const winnerId =
      match.winner_id === null ||
      match.winner_id === undefined
        ? null
        : Number(match.winner_id);

    const p1Id =
      match.participant1_id === null ||
      match.participant1_id === undefined
        ? null
        : Number(match.participant1_id);

    const p2Id =
      match.participant2_id === null ||
      match.participant2_id === undefined
        ? null
        : Number(match.participant2_id);

    const status =
      match.status ||
      "pending";

    let statusText =
      "待賽";

    let statusClass =
      "";

    if (isBye) {
      statusText =
        "BYE・自動晉級";
      statusClass =
        "bye-text";
    } else if (status === "ready") {
      statusText =
        "可進行";
      statusClass =
        "ready-text";
    } else if (status === "completed") {
      statusText =
        "已完成";
    } else if (participant1 && participant2) {
      statusText =
        "待賽";
    } else {
      statusText =
        "等待上一輪結果";
    }

    const cardClass =
      [
        "match-card",
        isBye ? "bye" : "",
        status === "ready" ? "ready" : "",
        status === "completed" ? "completed" : ""
      ]
        .filter(Boolean)
        .join(" ");

    const p1Class =
      p1Id !== null && winnerId === p1Id
        ? "player-name winner"
        : participant1
          ? "player-name"
          : "player-name empty";

    const p2Class =
      p2Id !== null && winnerId === p2Id
        ? "player-name winner"
        : participant2
          ? "player-name"
          : "player-name empty";

    const canSelectWinner =
      !isBye &&
      status === "ready" &&
      p1Id !== null &&
      p2Id !== null;

    const p1Action =
      canSelectWinner
        ? `
          onclick="
            selectWinner(
              ${Number(tournamentId)},
              ${Number(match.id)},
              ${Number(p1Id)},
              '${escapeHtml(participant1).replace(/'/g, "\\'")}'
            )
          "
          style="cursor:pointer;"
        `
        : "";

    const p2Action =
      canSelectWinner
        ? `
          onclick="
            selectWinner(
              ${Number(tournamentId)},
              ${Number(match.id)},
              ${Number(p2Id)},
              '${escapeHtml(participant2).replace(/'/g, "\\'")}'
            )
          "
          style="cursor:pointer;"
        `
        : "";

    const playOrder =
      Number(match.play_order);

    const matchLabel =
      isBye
        ? "BYE"
        : Number.isFinite(playOrder) && playOrder > 0
          ? `場次 ${playOrder}`
          : "待安排";

    return `
      <div
        class="${cardClass}"
        data-match-id="${escapeHtml(String(match.id))}"
      >
        <div class="match-label">
          #${escapeHtml(String(match.id))}
          ・
          ${escapeHtml(matchLabel)}
        </div>

        <div class="player-row" ${p1Action}>
          <span class="${p1Class}">
            ${escapeHtml(participant1 || "尚未產生")}
          </span>
          <span class="player-score">
            ${escapeHtml(String(score1))}
          </span>
        </div>

        <div class="player-row" ${p2Action}>
          <span class="${p2Class}">
            ${escapeHtml(
              participant2 ||
              (isBye ? "BYE" : "尚未產生")
            )}
          </span>
          <span class="player-score">
            ${escapeHtml(String(score2))}
          </span>
        </div>

        <div class="match-status ${statusClass}">
          ${escapeHtml(statusText)}
        </div>

        ${
          canSelectWinner
            ? `
              <div
                style="
                  padding:6px 9px 9px;
                  color:#8cff00;
                  font-size:11px;
                  text-align:center;
                  border-top:1px solid #292929;
                "
              >
                點選上方選手即可晉級
              </div>
            `
            : ""
        }
      </div>
    `;

  }

  // ==========================================================
  // 選擇勝者
  // ==========================================================

  async function selectWinner(
    tournamentId,
    matchId,
    winnerId,
    winnerName
  ) {

    const confirmed =
      confirm(
        `確定要讓「${winnerName}」晉級嗎？\n\n` +
        `確認後會將此選手設定為本場勝者，` +
        `並自動推進到下一場。`
      );


    if (!confirmed) {

      return;

    }


    try {

      await api(
        `/api/tournaments/${tournamentId}/matches/${matchId}`,
        {
          method: "PATCH",

          body:
            JSON.stringify({
              winnerId
            })
        }
      );


      await loadTournamentDetail(
        tournamentId
      );


    } catch (error) {

      console.error(
        "設定勝者失敗：",
        error
      );


      alert(
        error.message ||
        "設定勝者失敗"
      );

    }

  }


  // ==========================================================
  // HTML escape
  // ==========================================================

  function escapeHtml(
    value
  ) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  // ==========================================================
  // 啟動
  // ==========================================================

  checkLogin();

</script>

</body>
</html>
